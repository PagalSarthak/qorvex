<!doctype html><meta charset="utf-8">
<title>Qorvex</title>
<style>
:root{color-scheme:dark}
body{width:340px;margin:0;padding:12px;font:13px/1.4 system-ui,sans-serif;color:#e9eef5;background:#0d1015}
h3{margin:0;font-size:17px;letter-spacing:.3px}h3 b{color:#9d86ff}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:50%;background:#555}
.dot.on{background:#35c88a;box-shadow:0 0 0 3px #35c88a22}
.dot.bad{background:#ff6b6b}
small{color:#8b97a7}
input[type=number],input[type=password],select{box-sizing:border-box;padding:5px 7px;background:#161b23;color:inherit;border:1px solid #252d39;border-radius:7px;outline:none}
input[type=number]{width:76px}
input[type=password]{width:100%}
button{background:#7c5cff;color:#fff;border:0;border-radius:7px;padding:6px 10px;cursor:pointer;font:inherit}
button.ghost{background:#161b23;border:1px solid #252d39}
button:hover{filter:brightness(1.1)}
.r{display:flex;gap:7px;align-items:center;margin:7px 0;flex-wrap:wrap}
.card{background:#161b23;border:1px solid #252d39;border-radius:10px;padding:9px 10px;margin:9px 0}
.card h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#8b97a7}
.m{display:flex;gap:6px;align-items:center;padding:5px 0;border-top:1px solid #ffffff0d}
.m:first-of-type{border-top:0}
.m span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.m button{padding:3px 7px;font-size:11px}
label.chk{display:flex;gap:7px;align-items:center;cursor:pointer}
#msg{min-height:15px}
</style>
<div class="hd"><span class="dot" id="dot"></span><h3>Q<b>o</b>rvex</h3><span style="flex:1"></span><small id="ver"></small></div>
<div class="r"><span id="status"><small>checking…</small></span><span style="flex:1"></span><button class="ghost" id="open">Open app</button></div>

<div class="card">
  <h4>Capture</h4>
  <label class="chk"><input type="checkbox" id="intercept"> Take over browser downloads</label>
  <div class="r">Only files larger than <input type="number" id="minMB" min="0" step="0.5"> MB</div>
</div>

<div class="card">
  <h4>Connection</h4>
  <div class="r">Port <input type="number" id="port" min="1024" max="65535"> <button id="save">Save</button> <button class="ghost" id="sync" title="Read capture settings from the app">Sync</button></div>
  <div class="r"><input type="password" id="token" placeholder="extension token (optional)"></div>
  <small id="msg"></small>
</div>

<div class="card">
  <h4>This page's video</h4>
  <div class="r"><select id="q"><option value="best">Best</option><option>1080</option><option>720</option><option>480</option><option>360</option><option value="audio">Audio only</option></select>
  <button id="page">Download video</button></div>
  <small id="pmsg"></small>
</div>

<div class="card"><h4>Media detected on this page</h4><div id="media"><small>None yet. Play the video, then reopen.</small></div></div>
<script src="popup.js"></script>
