# Tag a release (git tag v1.0.2 && git push origin v1.0.2) and this workflow
# builds Windows/macOS/Linux, then publishes them on the GitHub Release.
name: Release Qorvex
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, sep: ";", name: qorvex-windows, bin: dist/qorvex.exe, test: true,  webview: "pywebview",     extra: "--onefile --windowed --icon qorvex.ico --collect-all pythonnet --collect-all clr_loader" }
          - { os: ubuntu-22.04,   sep: ":",  name: qorvex-linux,   bin: dist/qorvex,     test: true,  webview: "pywebview[qt]", extra: "--onefile --windowed" }
          - { os: macos-latest,   sep: ":",  name: qorvex-macos,   bin: dist/qorvex.app, test: false, webview: "pywebview",    extra: "--onedir --windowed" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller pytest psutil pystray "${{ matrix.webview }}" "yt-dlp[default]" bgutil-ytdlp-pot-provider
      - run: 'pip install libtorrent || echo "libtorrent unavailable: building without torrents"'
      - name: Tests
        if: matrix.test
        run: python -m pytest -q
      - name: Build browser extension
        run: python tools/build_extension.py
      - name: Bundle ffmpeg + deno
        shell: bash
        run: |
          mkdir -p build_cache
          BSEP=";"
          if [ "$RUNNER_OS" != "Windows" ]; then BSEP=":"; fi
          # --- deno (URL and zip layout differ per OS) ---
          if [ "$RUNNER_OS" = "macOS" ]; then
            DENO_URL="https://github.com/denoland/deno/releases/latest/download/deno-aarch64-apple-darwin.zip"
            DENO_ENTRY="deno"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            DENO_URL="https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip"
            DENO_ENTRY="deno.exe"
          else
            DENO_URL="https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip"
            DENO_ENTRY="deno"
          fi
          if [ ! -f build_cache/deno ] && [ ! -f build_cache/deno.exe ]; then
            if curl -fL -o build_cache/deno.zip "$DENO_URL"; then
              if unzip -o -q build_cache/deno.zip -d build_cache/denozip && cp "build_cache/denozip/$DENO_ENTRY" build_cache/deno; then
                echo "deno bundled"
              else
                echo "deno extraction failed: building without bundled deno"
              fi
              rm -rf build_cache/denozip
            else
              echo "deno download failed: building without bundled deno"
            fi
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg || echo "brew ffmpeg failed: building without bundled ffmpeg"
            cp "$(brew --prefix ffmpeg)/bin/ffmpeg" build_cache/ffmpeg 2>/dev/null || true
          elif [ "$RUNNER_OS" = "Windows" ]; then
            if [ ! -f build_cache/ffmpeg.exe ]; then
              if curl -fL -o build_cache/ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip; then
                if unzip -o -q build_cache/ffmpeg.zip -d build_cache/ffunzip && cp "build_cache/ffunzip/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe" build_cache/ffmpeg.exe; then
                  echo "ffmpeg bundled"
                else
                  echo "ffmpeg extraction failed: building without bundled ffmpeg"
                fi
                rm -rf build_cache/ffunzip
              else
                echo "ffmpeg download failed: building without bundled ffmpeg"
              fi
            fi
          else
            if [ ! -f build_cache/ffmpeg ]; then
              if curl -fL -o build_cache/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz; then
                if tar -xf build_cache/ffmpeg.tar.xz && cp "ffmpeg-master-latest-linux64-gpl/bin/ffmpeg" build_cache/ffmpeg; then
                  echo "ffmpeg bundled"
                else
                  echo "ffmpeg extraction failed: building without bundled ffmpeg"
                fi
              else
                echo "ffmpeg download failed: building without bundled ffmpeg"
              fi
            fi
          fi
          # one --add-binary arg per line; read with a while loop in the build step
          # so no shell ever parses the semicolons/colons in these arguments
          # (and no mapfile: GitHub's macOS bash is 3.2)
          : > build_cache/extra_args.txt
          if [ -f build_cache/ffmpeg ] || [ -f build_cache/ffmpeg.exe ]; then
            if [ -f build_cache/ffmpeg.exe ]; then
              printf '%s\n' "--add-binary=build_cache/ffmpeg.exe$BSEP." >> build_cache/extra_args.txt
            else
              printf '%s\n' "--add-binary=build_cache/ffmpeg$BSEP." >> build_cache/extra_args.txt
            fi
          fi
          if [ -f build_cache/deno ] || [ -f build_cache/deno.exe ]; then
            if [ -f build_cache/deno.exe ]; then
              printf '%s\n' "--add-binary=build_cache/deno.exe$BSEP." >> build_cache/extra_args.txt
            else
              printf '%s\n' "--add-binary=build_cache/deno$BSEP." >> build_cache/extra_args.txt
            fi
          fi
          cat build_cache/extra_args.txt
      - name: Build executable
        shell: bash
        run: |
          BUNDLE_ARGS=()
          if [ -s build_cache/extra_args.txt ]; then
            while IFS= read -r line; do
              BUNDLE_ARGS+=("$line")
            done < build_cache/extra_args.txt
          fi
          pyinstaller --clean --name qorvex ${{ matrix.extra }}             --add-data "qorvex/ui.html${{ matrix.sep }}qorvex"             --add-data "qorvex/logo.png${{ matrix.sep }}qorvex"             --add-data "extension${{ matrix.sep }}extension"             --hidden-import psutil --hidden-import libtorrent --collect-all yt_dlp             --collect-all webview --collect-all pystray --collect-all yt_dlp_plugins             --copy-metadata bgutil-ytdlp-pot-provider             "${BUNDLE_ARGS[@]}"             --exclude-module tkinter --noconfirm run.py
      - name: Package (zip the binary with a versioned name)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/qorvex.exe "release/Qorvex-${VERSION}-windows-x64.exe"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cd dist && zip -qry "../release/Qorvex-${VERSION}-macos.zip" qorvex.app && cd ..
          else
            cp dist/qorvex "release/Qorvex-${VERSION}-linux-x64"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: release/* }
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with: { name: "qorvex-extension", path: "extension" }
  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: "qorvex-*", merge-multiple: false }
      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f | while read -r f; do cp "$f" release/; done
          ls -la release
      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
