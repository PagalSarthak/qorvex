# Push this project to GitHub, open Actions > "Build Qorvex" > Run workflow.
# Download the Windows .exe, Linux and macOS binaries from the run's Artifacts.
name: Build Qorvex
on: [workflow_dispatch, push]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, sep: ";", name: qorvex-windows, bin: dist/qorvex.exe, test: true,  extra: "--windowed --icon qorvex.ico --collect-all pythonnet --collect-all clr_loader" }
          - { os: ubuntu-22.04,   sep: ":", name: qorvex-linux,   bin: dist/qorvex,     test: true,  extra: "--windowed" }
          - { os: macos-latest,   sep: ":", name: qorvex-macos,   bin: dist/qorvex,     test: false, extra: "--windowed" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller pytest psutil pywebview "yt-dlp[default]"
      - run: pip install libtorrent || echo "libtorrent unavailable: building without torrents"
      - name: Tests
        if: matrix.test
        run: python -m pytest -q
      - name: Build browser extension
        run: python tools/build_extension.py
      - name: Build executable
        run: >
          pyinstaller --onefile --clean --name qorvex ${{ matrix.extra }}
          --add-data "qorvex/ui.html${{ matrix.sep }}qorvex"
          --add-data "qorvex/logo.png${{ matrix.sep }}qorvex"
          --add-data "extension${{ matrix.sep }}extension"
          --hidden-import psutil --hidden-import libtorrent --collect-all yt_dlp
          --collect-all webview
          --exclude-module tkinter --noconfirm run.py
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: "${{ matrix.bin }}" }
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with: { name: "qorvex-extension", path: "extension" }
